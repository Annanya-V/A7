<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Card Layout</title>
    <style>

        /* The main outer wrapper */
        .container {
            display: flex;
            width: 100%;
            padding: 20px;
        }

        /* The single card holding the 3 boxes */
        .inner-card {
            height: auto;
            background-color: #d77e7e; /* Clean white card background */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Soft, modern shadow */
            display: flex;
            flex-direction: row; /* Stack the items vertically */
            gap: 15px; /* Add even spacing between items */
            width: 1100px;
            justify-content: space-around;
            
        }

        /* Styling for the text items inside the card */
        .box {
            background-color: #f5abbd; /* Subtle gray background for each item */
            color: #495057; /* Dark gray text */
            padding: 12px 20px;
            border-radius: 6px;
            text-align: center; /* Center the text inside the item */
            font-weight: 500;
            align-items: center;
            width: 400px;
        }
        th,
        td {
            padding: 10px;
            text-align: left;
        }
        @media (max-width: 700px){
            body{
                background-color: bisque;
            }
            p{
                color: azure;
            }
        }
    </style>
</head>
<body>
    <h1>Learning Flexbox</h1>
    <details>
        <summary>What is flexbox</summary>
        <p>Flexbox is a CSS layout module that makes it easier to design flexible designs.</p>
    </details>

    <div class="container">
        <!-- The 3 boxes are now combined into this single card -->
        <div class="inner-card">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
        </div>
    </div>

</body>
</html>
