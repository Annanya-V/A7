<!DOCTYPE html>
<html>
<head>
    <title>Login - Dashkart</title>
    <link rel="stylesheet" href="dash.css">
    <link rel="stylesheet" href="stylelogdash.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">

            <a href="index.html" class="logo-link">
                <h1 class="logo">dash<span>kart</span></h1>
            </a>

            <h2>Login to your account</h2>
            <p class="login-sub">Get groceries delivered in 10 minutes</p>

            <form>
                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <button type="submit" class="login-btn">Login</button>
            </form>

            <p class="login-bottom">Don't have an account? <a href="#">Sign up</a></p>
            <p class="login-bottom"><a href="index.html">Back to home</a></p>

        </div>
    </div>

</body>
</html>
